name: www-control-center
services:
  www:
    image: ${WWW_IMAGE:?Set an immutable Rust image digest}
    restart: unless-stopped
    user: "${WWW_UID:-501}:${WWW_GID:-20}"
    environment:
      TZ: America/Los_Angeles
      WWW_LISTEN: 0.0.0.0:4201
      WWW_DATABASE_PATH: /app/data/control-center.sqlite
      MEDIA_STORAGE_DIR: /app/media
      WWW_SECRETS_DIR: /run/secrets
      HA_URL: ${HA_URL:?Set the Home Assistant origin}
      WORKER_CYCLES: ${WORKER_CYCLES:?Explicitly choose on or off}
      BEDROOM_SWITCH_INPUT_ENABLED: ${BEDROOM_SWITCH_INPUT_ENABLED:-false}
      BEDROOM_SWITCH_INPUT_VERIFIED: ${BEDROOM_SWITCH_INPUT_VERIFIED:-false}
      BEDROOM_SWITCH_INPUT_ENTITY_ID: ${BEDROOM_SWITCH_INPUT_ENTITY_ID:-}
    volumes:
      - ${WWW_SECRETS_DIR:?Set the secrets directory}:/run/secrets:ro
      # Mount the directory, not just .sqlite: SQLite WAL/SHM must persist together.
      - ${WWW_DATA_DIR:?Set the data directory}/sqlite:/app/data
      - ${WWW_DATA_DIR}/media:/app/media
    ports:
      - 127.0.0.1:${WWW_PORT:-4201}:4201
    healthcheck:
      test: [CMD, www-server, healthcheck]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 60s
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

name: hindsight
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:a88678c038b0e4340822b02a5efc566c56d8176b5bffa731bc433fd37f978e4c
    container_name: hindsight
    restart: unless-stopped
    # Preserve existing exposure during migration; narrowing it is a separate change.
    ports:
      - '8888:8888'
      - '9999:9999'
    env_file:
      - path: ${HINDSIGHT_ENV_FILE:?Provision the existing Hindsight runtime environment securely}
        format: raw
    volumes:
      - type: volume
        source: hindsight_data
        target: /home/hindsight/.pg0
        volume:
          nocopy: true
      - type: volume
        source: hindsight_codex_home
        target: /home/hindsight/.codex-hindsight
        volume:
          nocopy: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
volumes:
  hindsight_data:
    external: true
    name: hindsight_pg0
  hindsight_codex_home:
    external: true
    name: hindsight_codex_home

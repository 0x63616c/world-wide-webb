[package]
name = "homelab-client"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Guided enrollment for Git-managed macOS homelabs"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process", "fs"] }

tempfile = "3"
crossterm = "0.29.0"
sha2 = "0.11.1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }

[dev-dependencies]
rustix = { version = "1", features = ["pty", "termios"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[test]]
name = "vm_e2e"
path = "tests/vm_e2e.rs"
harness = false

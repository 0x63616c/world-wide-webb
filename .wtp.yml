version: "1.0"

# Worktrees live outside the repo tree entirely (never nested under
# another repo subfolder) so lefthook, glob-based tooling,
# and gitignore scoping never get confused by a nested checkout. See
# https://github.com/0x63616c/world-wide-webb/issues/182.
defaults:
  # Worktrees must land in ~/.worktrees/world-wide-webb: the hourly worktree
  # cleanup only looks there. wtp does not expand ~ or $HOME, so this path is
  # relative to the main checkout and is only correct when that checkout is
  # three directories below the home directory (~/Documents/ChatGPT/world-wide-webb).
  # From a checkout anywhere else `wtp add` resolves to the wrong place; use the
  # `git worktree add` fallback in docs/DEVELOPMENT.md instead.
  base_dir: "../../../.worktrees/world-wide-webb"

hooks:
  post_create:
    # A branch created from origin/main inherits main as its upstream. Run this
    # safety repair before any fallible setup step; the branch is not on origin
    # yet, so configure its eventual same-named ref directly rather than using
    # `git branch --set-upstream-to`.
    - type: command
      command: "bash scripts/configure-worktree-upstream.sh"

    # Runtime credentials stay outside Git; setup installs no credential files.
    - type: command
      command: "bash tools/setup"

    - type: command
      command: "lefthook install --force"

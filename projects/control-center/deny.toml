[graph]
all-features = true

[advisories]
# chrono and chrono-tz were declared unmaintained (not vulnerable) in Nov 2026; the
# server-wide move to jiff is tracked in #1138. Remove these once it lands.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; jiff migration tracked" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; jiff migration tracked" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib"
]
private.ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/launchbadge/sqlx"]

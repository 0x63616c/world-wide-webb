delivery_handler: standard_ios
# Per-app configuration read by fastlane/Fastfile, scripts/app-config.rb and the CI workflows.
name: Tapes
# Xcode project, generated from project.yml by XcodeGen (paths relative to this folder).
project: Tapes.xcodeproj
scheme: Tapes
# Schemes for the other platforms; delivery uploads each to the same TestFlight app.
platforms:
  tvos: Tapes-tvOS
  macos: Tapes-macOS
bundle_id: co.worldwidewebb.tapes
# App extensions per platform (target: bundle ID), each signed with its own Match profile.
extensions:
  tvos:
    Tapes-TopShelf: co.worldwidewebb.tapes.TopShelf
version: 1.0.1
testflight: true
testflight_group: Owner Preview
beta_description: Tapes plays your own movies, shows and DJ sets from the Mac mini at home.

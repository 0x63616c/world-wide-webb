[package]
name = "tapes"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "UNLICENSED"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["json", "macros"] }
clap = { version = "4.6", features = ["derive", "env"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

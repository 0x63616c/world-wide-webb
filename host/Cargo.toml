[package]
name = "homelab-host-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
homelab-client = { git = "https://github.com/0x63616c/homelab-cli.git", rev = "1c06e59f39373045e8be20a9957167dbc58a1644" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process", "fs"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

[package]
name = "folding-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
folding-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
worker = { version = "=0.8.7", features = ["d1", "queue"] }
askama = { version = "=0.16.1", default-features = false, features = ["derive", "std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
ciborium = "=0.2.2"
serde_bytes = "=0.11.19"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", features = ["Crypto", "WorkerGlobalScope"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
futures-util = "=0.3.31"

[dev-dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

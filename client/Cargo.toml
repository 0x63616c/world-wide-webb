[package]
name = "homelab-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Typed remote management for a declarative macOS homelab"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["process", "fs"] }

tempfile = "3"
crossterm = "0.29.0"
sha2 = "0.11.1"

[dev-dependencies]
rustix = { version = "1", features = ["pty", "termios"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

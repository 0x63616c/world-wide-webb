name: Review status

# Read-only: prints each iOS App Store version's state, its build and the latest review
# submission. Grep the log for STATUS:, REVIEW:, ITEM: and REJECTION: lines.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder under apps/ (for example tendr)'
        type: string
        default: tendr

permissions:
  contents: read

jobs:
  status:
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 10
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ruby-tools
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: App Store Connect review status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP: ${{ inputs.app }}
        run: bundle exec ruby scripts/review-status.rb "$APP"

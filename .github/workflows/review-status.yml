name: Review status

# Read-only: prints each iOS App Store version's state, its build and the latest review
# submission. Grep the log for STATUS:, REVIEW:, ITEM: and REJECTION: lines.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder under apps/ (for example tendr)'
        type: string
        default: tendr

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ruby-tools
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: App Store Connect review status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ inputs.app == 'folding' && secrets.FOLDING_ASC_PRIVATE_KEY || secrets.ASC_KEY_CONTENT }}
          APP: ${{ inputs.app }}
        run: bundle exec ruby scripts/review-status.rb "$APP"
      - name: Inspect release source cleanliness
        if: inputs.app == 'folding'
        run: git status --short
      - name: Read-only Folding backend receipt check
        if: inputs.app == 'folding'
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDING_PRODUCTION_WORKER_CONFIG: ${{ secrets.FOLDING_PRODUCTION_WORKER_CONFIG }}
          FOLDING_RELEASE_POLICY_TOKEN: ${{ secrets.FOLDING_RELEASE_POLICY_TOKEN }}
        run: bundle exec ruby apps/folding/scripts/continuous-delivery.rb receipt

name: CI
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch:
    inputs:
      force_all:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    outputs:
      products: ${{ steps.select.outputs.products }}
      tooling: ${{ steps.select.outputs.tooling }}
      security_languages: ${{ steps.select.outputs.security_languages }}
    steps:
    - &id001
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        HEAD: ${{ github.sha }}
        EVENT: ${{ github.event_name }}
        FORCE: ${{ inputs.force_all || false }}
      run: python3 scripts/ci/dispatch.py
    - uses: actions/upload-artifact@v4
      with:
        name: repository-selection
        path: ${{ runner.temp }}/ci-selection.json
        retention-days: 14
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: '!contains(fromJSON(steps.select.outputs.products), ''control-center'')'
      with:
        name: ci-selection
        path: ${{ runner.temp }}/control-center/ci-selection.json
        retention-days: 7
        if-no-files-found: error
  typecheck:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
    - *id001
    - run: bash apps/control-center/tools/install_ci_linters.sh
    - run: |-
        actionlint
        python3 -m compileall -q scripts/ci
  test-unit:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
    - *id001
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.15.2
    - run: python3 -m pip install PyYAML==6.0.3
    - uses: ./.github/actions/ruby-tools
    - run: |-
        python3 -m unittest discover -s scripts/ci -p 'test_*.py'
        ruby scripts/check-release.rb
        python3 scripts/test-changed-apps.py
  control-center:
    name: Control Center
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'control-center')
    uses: ./.github/workflows/control-center-ci.yml
    secrets: inherit
    with:
      force_all: ${{ inputs.force_all || false }}
  folding:
    name: Folding
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'folding')
    uses: ./.github/workflows/folding-ci.yml
    secrets: inherit
  tendr:
    name: Standard iOS
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'tendr')
    uses: ./.github/workflows/tendr-ci.yml
    secrets: inherit
  callkeep:
    name: Callkeep
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'callkeep')
    uses: ./.github/workflows/callkeep-ci.yml
    secrets: inherit
  golink:
    name: Golink Safari
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'golink')
    uses: ./.github/workflows/golink-safari-ci.yml
    secrets: inherit
  homelab:
    name: Homelab
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'homelab')
    uses: ./.github/workflows/homelab-ci.yml
    secrets: inherit
  sites:
    name: Sites
    needs:
    - changes
    - typecheck
    - test-unit
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.typecheck.result == 'success' || needs.typecheck.result
      == 'skipped') && (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') && contains(fromJSON(needs.changes.outputs.products),
      'sites')
    uses: ./.github/workflows/site.yml
    secrets: inherit
  security:
    needs: changes
    if: needs.changes.outputs.security_languages != '[]'
    uses: ./.github/workflows/security.yml
    with:
      languages: ${{ needs.changes.outputs.security_languages }}
    permissions:
      contents: read
      security-events: write
      actions: read
  build-and-test:
    if: always() && !cancelled()
    needs:
    - changes
    - typecheck
    - test-unit
    - control-center
    - folding
    - tendr
    - callkeep
    - golink
    - homelab
    - sites
    - security
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
    - *id001
    - env:
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python3 scripts/ci/gate.py

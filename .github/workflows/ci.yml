name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.select.outputs.apple }}
      image: ${{ steps.select.outputs.image }}
      infra: ${{ steps.select.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD: ${{ github.sha }}
          FORCE: ${{ inputs.force_all || false }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 tools/ci_changes.py "$BASE" "$HEAD" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: ci-selection.json
          retention-days: 7
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/install_ci_linters.sh
      - run: bash tools/check lint
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-test
      - run: cargo test --locked --workspace
      - run: bash tools/check ops
      - run: python3 -m unittest discover -s tools -p 'test_ci.py'
  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select supported Xcode
        run: echo "DEVELOPER_DIR=$(python3 .github/scripts/apple-toolchain.py)" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - id: apple-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apple/Packages/PanelKit/.build
            ${{ runner.temp }}/apple-derived
          key: apple-${{ runner.os }}-${{ hashFiles('apple/project.yml', 'apple/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: apple-${{ runner.os }}-${{ hashFiles('apple/project.yml', 'apple/**/Package.resolved') }}-
      - run: xcrun swift-format lint --strict --recursive apple/App apple/Extensions apple/Packages/PanelKit/Sources apple/Tests
      - run: bash tools/check apple
      - name: Build and exercise iPad target
        env:
          APPLE_DERIVED_DATA: ${{ runner.temp }}/apple-derived
        run: bash tools/test_apple.sh
      - uses: actions/cache/save@v4
        if: always() && steps.apple-cache.outputs.cache-hit != 'true'
        with:
          path: |
            apple/Packages/PanelKit/.build
            ${{ runner.temp }}/apple-derived
          key: ${{ steps.apple-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-failure-evidence
          path: |
            ${{ runner.temp }}/apple-derived/*.xcresult
            ${{ runner.temp }}/apple-derived/*.log
          retention-days: 3
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: www-server:check
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=www-mini
          cache-to: type=gha,mode=max,scope=www-mini
      - name: Verify image identity and runtime
        run: python3 tools/test_container.py www-server:check "$GITHUB_SHA"
  infra:
    env:
      TF_VAR_state_passphrase: fixture-only-open-tofu-encryption-passphrase
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - run: tofu -chdir=infra/cloudflare fmt -check
      - run: tofu -chdir=infra/cloudflare init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/cloudflare validate
      - run: tofu -chdir=infra/cloudflare test
      - run: python3 tools/test_state_backend.py
  build-and-test:
    if: always()
    needs: [changes, typecheck, test-unit, apple, image, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_gate.py

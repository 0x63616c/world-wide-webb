name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        type: boolean
        default: true
defaults:
  run:
    working-directory: apps/control-center
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  changes:
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 5
    outputs:
      publish_image: ${{ steps.select.outputs.publish_image }}
      checks: ${{ steps.select.outputs.checks }}
      apple: ${{ steps.select.outputs.apple }}
      image: ${{ steps.select.outputs.image }}
      infra: ${{ steps.select.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD: ${{ github.sha }}
          FORCE: ${{ inputs.force_all || false }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 tools/ci_changes.py "$BASE" "$HEAD" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: apps/control-center/ci-selection.json
          retention-days: 7
  typecheck:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash tools/install_ci_linters.sh
      - run: bash tools/check lint
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/control-center/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/control-center/rust-toolchain.toml', 'apps/control-center/Cargo.lock') }}-check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  test-unit:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/control-center/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/control-center/rust-toolchain.toml', 'apps/control-center/Cargo.lock') }}-test
      - run: cargo test --locked --workspace
      - run: bash tools/check dependencies
      - run: bash tools/check ops
      - run: python3 -m unittest discover -s tools -p 'test_ci.py'
  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache: false
          build-warnings: ""
      - name: Select supported Xcode
        id: xcode
        run: |
          echo "DEVELOPER_DIR=$(python3 ../../.github/scripts/apple-toolchain.py)" >> "$GITHUB_ENV"
          echo "cache-key=$(python3 ../../.github/scripts/apple-toolchain.py --cache-key)" >> "$GITHUB_OUTPUT"
      - run: brew install xcodegen
      - id: apple-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/control-center/apple/Packages/PanelKit/.build
            ${{ runner.temp }}/apple-derived
          key: apple-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('apps/control-center/apple/project.yml', 'apps/control-center/apple/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: apple-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('apps/control-center/apple/project.yml', 'apps/control-center/apple/**/Package.resolved') }}-
      - run: xcrun swift-format lint --strict --recursive apple/App apple/Extensions apple/Packages/PanelKit/Sources apple/Tests
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/control-center/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ runner.arch }}-${{ hashFiles('apps/control-center/rust-toolchain.toml', 'apps/control-center/Cargo.lock') }}-native-contract
      - run: bash tools/check apple
      - name: Exercise actual Swift and Rust contract
        run: bash tools/check integration
      - name: Build and exercise iPad target
        env:
          APPLE_DERIVED_DATA: ${{ runner.temp }}/apple-derived
        run: bash tools/test_apple.sh
      - uses: actions/cache/save@v4
        if: always() && steps.apple-cache.outputs.cache-hit != 'true'
        with:
          path: |
            apps/control-center/apple/Packages/PanelKit/.build
            ${{ runner.temp }}/apple-derived
          key: ${{ steps.apple-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-failure-evidence
          path: |
            ${{ runner.temp }}/apple-derived/*.xcresult
            ${{ runner.temp }}/apple-derived/*.log
          retention-days: 3
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/control-center
          load: true
          tags: www-server:check
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=www-mini
          cache-to: type=gha,mode=max,scope=www-mini
      - uses: ./.github/actions/ghcr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.publish_image == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Publish the built image without rebuilding
        id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.publish_image == 'true'
        env:
          IMAGE: ghcr.io/0x63616c/www-control-center-mini:${{ github.sha }}
        run: |
          docker tag www-server:check "$IMAGE"
          docker push "$IMAGE"
          python3 tools/ci_image.py record "$GITHUB_SHA" --tag "$IMAGE"
      - name: Verify image identity and runtime
        env:
          IMAGE: ${{ steps.image.outputs.image || 'www-server:check' }}
        run: python3 tools/test_container.py "$IMAGE" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.publish_image == 'true'
        with:
          name: ci-image
          path: apps/control-center/ci-image.json
          retention-days: 7
  infra:
    env:
      TF_VAR_state_passphrase: fixture-only-open-tofu-encryption-passphrase
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - run: tofu -chdir=../../infra/cloudflare/home fmt -check
      - run: tofu -chdir=../../infra/cloudflare/home init -backend=false -lockfile=readonly
      - run: tofu -chdir=../../infra/cloudflare/home validate
      - run: tofu -chdir=../../infra/cloudflare/home test
      - run: python3 tools/test_state_backend.py
  build-and-test:
    if: always()
    needs: [changes, typecheck, test-unit, apple, image, infra]
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_gate.py

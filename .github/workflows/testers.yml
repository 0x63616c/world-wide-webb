name: TestFlight testers

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/"
        type: string
        default: tendr

permissions:
  contents: read

jobs:
  testers:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_DOCS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ruby-tools
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP: ${{ inputs.app }}
        run: bundle exec fastlane ios testers app:"$APP"

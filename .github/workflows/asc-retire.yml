name: Retire discontinued apps in ASC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Report only, expire builds and delete profiles, or delete retired bundle IDs"
        type: choice
        default: report
        options: [report, retire, delete-ids]

permissions:
  contents: read

concurrency:
  group: asc-retire
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.15.2
      - name: Install API authentication dependency
        run: python3 -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Run guarded retirement
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/asc-retire.py --mode "$MODE"

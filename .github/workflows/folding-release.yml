name: Folding delivery
'on':
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      channel:
        type: string
        required: true
      ci_run_id:
        type: string
        required: true
      ci_run_attempt:
        type: string
        required: true
      ci_run_url:
        type: string
        required: true
      receipt_run_id:
        type: string
        default: ''
      backend:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: xcode-27
    timeout-minutes: 180
    environment: production
    concurrency:
      group: app-store-folding
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/folding
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FOLDING_SOURCE_CI_RUN_URL: ${{ inputs.ci_run_url }}
      FOLDING_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{
        github.run_attempt }}
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: '!gh auth git-credential'
      SOURCE_SHA: ${{ inputs.source }}
      CHANNEL: ${{ inputs.channel }}
      APP: folding
      SOURCE_CI_RUN_ID: ${{ inputs.ci_run_id }}
      SOURCE_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.source }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/folding-tools
      with:
        target: deploy
    - name: Install source validation dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/folding-release-python"
        "$RUNNER_TEMP/folding-release-python/bin/pip" install -r ../../scripts/requirements.txt
        printf '%s\n' "$RUNNER_TEMP/folding-release-python/bin" >> "$GITHUB_PATH"
    - name: Recheck the chosen release source
      working-directory: .
      env:
        DELIVERY_OPERATION: recheck
      run: python3 scripts/ios_delivery.py
    - uses: actions/download-artifact@v4
      if: inputs.channel == 'beta' && inputs.backend
      with:
        name: folding-worker-${{ inputs.source }}
        path: apps/folding/backend/crates/worker/build
        run-id: ${{ inputs.ci_run_id }}
        github-token: ${{ github.token }}
    - name: Publish the tested Worker and immutable deployment receipt
      if: inputs.channel == 'beta' && inputs.backend
      env:
        GH_TOKEN: ${{ github.token }}
        FOLDING_PRODUCTION_WORKER_CONFIG: ${{ secrets.FOLDING_PRODUCTION_WORKER_CONFIG }}
        FOLDING_RELEASE_POLICY_TOKEN: ${{ secrets.FOLDING_RELEASE_POLICY_TOKEN }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.FOLDING_DEPLOY_TOKEN }}
      run: bundle exec ruby scripts/continuous-delivery.rb backend
    - name: Resolve the current immutable backend receipt
      env:
        GH_TOKEN: ${{ github.token }}
        FOLDING_PRODUCTION_WORKER_CONFIG: ${{ secrets.FOLDING_PRODUCTION_WORKER_CONFIG }}
        FOLDING_RELEASE_POLICY_TOKEN: ${{ secrets.FOLDING_RELEASE_POLICY_TOKEN }}
      run: bundle exec ruby scripts/continuous-delivery.rb receipt
    - name: Prepare exact-source native CI evidence
      if: inputs.channel == 'beta'
      run: bundle exec ruby scripts/continuous-delivery.rb evidence
    - name: Prepare pinned Apple tools for this native delivery
      run: |
        brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
        python3 scripts/apple-build-environment.py --create-device
    - name: Authorize private signing storage
      if: inputs.channel == 'beta'
      uses: ./.github/actions/match-access
      with:
        age-key: ${{ secrets.AGE_PRIVATE_KEY }}
    - name: Archive once and deliver the exact processed internal beta
      id: beta
      env:
        GH_TOKEN: ${{ github.token }}
        FOLDING_RELEASE_POLICY_TOKEN: ${{ secrets.FOLDING_RELEASE_POLICY_TOKEN }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.FOLDING_ASC_PRIVATE_KEY }}
        MATCH_PASSWORD: ${{ secrets.FOLDING_MATCH_PASSWORD }}
        FOLDING_SIGNING_GIT_URL: https://github.com/0x63616c/certificates.git
        MATCH_GIT_BRANCH: folding
        MATCH_CLONE_BRANCH_DIRECTLY: 'true'
        FOLDING_TESTFLIGHT_GROUPS: ${{ vars.FOLDING_TESTFLIGHT_GROUPS }}
      if: inputs.channel == 'beta'
      run: |
        version=$(ruby -ryaml -e 'print YAML.safe_load_file("app.yml").fetch("version")')
        ../../scripts/ci/apple-desktop.sh bundle exec fastlane ios continuous_beta "version:$version" "evidence:$FOLDING_BETA_EVIDENCE"
    - name: Bind the processed beta receipt to source CI
      if: inputs.channel == 'beta'
      working-directory: .
      env:
        DELIVERY_OPERATION: receipt
      run: python3 scripts/ios_delivery.py
    - uses: actions/upload-artifact@v4
      if: inputs.channel == 'beta'
      with:
        name: ios-beta-folding-${{ inputs.source }}
        path: build/beta-receipt.json
        retention-days: 90
        if-no-files-found: error
        overwrite: true
    - uses: actions/download-artifact@v4
      if: inputs.channel == 'store'
      with:
        name: ios-beta-folding-${{ inputs.source }}
        path: build
        run-id: ${{ inputs.receipt_run_id }}
        github-token: ${{ github.token }}
    - name: Promote the existing processed build to App Review
      if: inputs.channel == 'store'
      env:
        GH_TOKEN: ${{ github.token }}
        FOLDING_RELEASE_POLICY_TOKEN: ${{ secrets.FOLDING_RELEASE_POLICY_TOKEN }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.FOLDING_ASC_PRIVATE_KEY }}
        DUO_HOST_CONTROL: '1'
      run: |
        ../../scripts/ci/apple-desktop.sh bundle exec fastlane ios promote "receipt:$GITHUB_WORKSPACE/build/beta-receipt.json"
    name: publish

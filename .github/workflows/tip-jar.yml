name: Tip jar

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          filter: blob:none
      - id: detect
        uses: ./.github/actions/affected
        with:
          base: ${{ github.event.pull_request.base.sha }}
          intent: verify

  tip-jar:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(needs.changes.outputs.apps), 'tendr')
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build for testing
        timeout-minutes: 15
        run: |
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-27-0
          udid=$(xcrun simctl create "Tip Jar" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          scripts/boot-simulator.sh "$udid" 300
          xcodebuild build-for-testing -project apps/tendr/Still.xcodeproj -scheme Still -destination "id=$udid" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
      - name: Tip jar UI tests (dark and light), with screenshots
        timeout-minutes: 15
        run: |
          for appearance in dark light; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --operatorName "" --batteryState discharging --batteryLevel 100
            mkdir -p "build/tip-jar/$appearance"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/build/tip-jar/$appearance" xcodebuild test-without-building \
              -project apps/tendr/Still.xcodeproj -scheme Still -destination "id=$UDID" -derivedDataPath build/DerivedData \
              -only-testing:StillUITests/TipJarTests -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -resultBundlePath "build/tip-jar/TipJarTests-$appearance.xcresult" 2>&1 \
              | grep -E "Test Case|error:|failed|TEST (SUCC|FAIL)" || true
            xcrun xcresulttool get test-results summary --path "build/tip-jar/TipJarTests-$appearance.xcresult" --compact \
              | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s.get("result"), s.get("passedTests"), "passed", s.get("failedTests"), "failed"); [print(f.get("testName"), "-", f.get("failureText")) for f in s.get("testFailures", [])]; sys.exit(0 if s.get("result")=="Passed" else 1)'
          done
      - name: Record a purchase (dark)
        timeout-minutes: 5
        run: |
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/tip-jar/tip-jar-purchase.mp4 &
          recorder=$!
          sleep 2
          xcodebuild test-without-building -project apps/tendr/Still.xcodeproj -scheme Still -destination "id=$UDID" \
            -derivedDataPath build/DerivedData -only-testing:StillUITests/TipJarTests/testTipPurchaseCelebratesThenCloses -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -quiet || status=$?
          kill -INT "$recorder"
          wait "$recorder" || true
          exit "${status:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tip-jar-screens
          path: |
            build/tip-jar/dark/*.png
            build/tip-jar/light/*.png
            build/tip-jar/*.mp4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tip-jar-results
          path: build/tip-jar/*.xcresult
          if-no-files-found: ignore
      - name: Delete simulator
        if: always()
        run: |
          if [ -n "${UDID:-}" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          fi

# Builds the iOS Expo kiosk shell (apps/panel) and uploads it to TestFlight.
# The app is a thin native wrapper that loads https://app.worldwidewebb.co at
# runtime (apps/panel/app.config.ts), so this only needs to ship when the native
# shell changes , plus a monthly cron to refresh the 90-day TestFlight build expiry.
# It targets the same bundle id as the original "Evee" app, so builds land as updates
# to the existing TestFlight app (was 1.0, build 48). Signing reuses fastlane match
# against github.com/0x63616c/certificates. Secrets from SOPS vault (CC-k8t7).
name: iOS Build

on:
  pull_request:
    paths:
      - "apps/panel/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/panel/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ios-build.yml"
  schedule:
    - cron: "0 12 1 * *" # 1st of every month at noon UTC , keeps the TestFlight build fresh (90-day expiry)
  workflow_dispatch:
    inputs:
      regenerate_profiles:
        description: >-
          Regenerate the provisioning profile instead of reusing the cached one.
          Needed for ONE run after an App ID capability changes (which marks
          existing profiles Invalid); a normal readonly build would otherwise
          ship a binary missing the new entitlement.
        type: boolean
        default: false

# Least privilege: neither job writes to the repo. The TestFlight upload
# authenticates to App Store Connect and to the certificates repo with its own
# credentials from the vault, never with GITHUB_TOKEN.
permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"

concurrency:
  # Keyed by ref so a PR's verify job cannot cancel a main upload in flight.
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: compile the native shell WITHOUT signing, secrets or upload, so a
  # broken Expo prebuild / native module fails the PR instead of
  # surfacing after merge, when main has already deployed. The upload job below
  # is push-only, so TestFlight never sees a PR build.
  verify:
    name: Verify native build (no signing)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Pin the toolchain instead of trusting the runner image's default Xcode.
      # Expo's expo-modules-jsi headers need Xcode 26.4+ (Swift 6.3); Xcode 26.2
      # rejects their SWIFT_RETURNS_RETAINED annotations. Bump deliberately.
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Expo iOS project
        run: bun run prebuild
        working-directory: apps/panel
      # Resolves CocoaPods and compiles the generated app target.
      # CODE_SIGNING_ALLOWED=NO keeps it free of match certs,
      # the App Store Connect key and the protected `production` environment.
      - name: Compile app target (unsigned)
        working-directory: apps/panel
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/ControlCenter.xcworkspace \
            -scheme ControlCenter \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

  build:
    name: Build & Upload to TestFlight
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    # Protected environment: AGE_PRIVATE_KEY is gated here (CC-k8t7).
    environment: production
    defaults:
      run:
        working-directory: apps/panel
    steps:
      - uses: actions/checkout@v5

      # Pin the toolchain instead of trusting the runner image's default Xcode.
      # Expo's expo-modules-jsi headers need Xcode 26.4+ (Swift 6.3); Xcode 26.2
      # rejects their SWIFT_RETURNS_RETAINED annotations. Bump deliberately.
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version

      # Decrypt vault — the only step touching AGE_PRIVATE_KEY. No set -x here.
      - name: Decrypt vault (SOPS+age)
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          brew install sops age 2>/dev/null || true

          extract() { sops -d "$GITHUB_WORKSPACE/secrets/vault.yaml" | grep "^$1:" | cut -d' ' -f2-; }

          MATCH_PWD=$(extract APP_STORE_CONNECT_API__MATCH_PASSWORD)
          GIT_AUTH=$(extract MATCH_GIT_BASIC_AUTHORIZATION)
          KEY_ID=$(extract APP_STORE_CONNECT_API__KEY_ID)
          ISSUER_ID=$(extract APP_STORE_CONNECT_API__ISSUER_ID)
          P8=$(extract APP_STORE_CONNECT_API__P8_CONTENT)
          CF_ID=$(extract CF_ACCESS_KIOSK_TOKEN__CLIENT_ID)
          CF_SECRET=$(extract CF_ACCESS_KIOSK_TOKEN__CLIENT_SECRET)

          echo "::add-mask::$MATCH_PWD"
          echo "::add-mask::$GIT_AUTH"
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$ISSUER_ID"
          echo "::add-mask::$P8"
          echo "::add-mask::$CF_ID"
          echo "::add-mask::$CF_SECRET"

          echo "MATCH_PASSWORD=$MATCH_PWD" >> "$GITHUB_ENV"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$GIT_AUTH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"
          echo "ASC_KEY_CONTENT=$P8" >> "$GITHUB_ENV"
          echo "CF_ACCESS_KIOSK_CLIENT_ID=$CF_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_KIOSK_CLIENT_SECRET=$CF_SECRET" >> "$GITHUB_ENV"
          echo "MATCH_GIT_URL=https://github.com/0x63616c/certificates.git" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Generate Expo iOS project
        run: bun run prebuild

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/panel

      - name: Build and upload to TestFlight
        run: bundle exec fastlane release
        env:
          # All from GITHUB_ENV set by "Decrypt vault" step.
          MATCH_PASSWORD: ${{ env.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ env.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ env.MATCH_GIT_URL }}
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ env.ASC_KEY_CONTENT }}
          CF_ACCESS_KIOSK_CLIENT_ID: ${{ env.CF_ACCESS_KIOSK_CLIENT_ID }}
          CF_ACCESS_KIOSK_CLIENT_SECRET: ${{ env.CF_ACCESS_KIOSK_CLIENT_SECRET }}
          MATCH_REGENERATE: ${{ inputs.regenerate_profiles }}

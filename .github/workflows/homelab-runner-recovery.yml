name: Homelab runner recovery
on:
  push:
    branches: [codex/linux-runner-canary]
    paths: [.github/workflows/homelab-runner-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homelab-runner-recovery
  cancel-in-progress: false
jobs:
  linux:
    name: Linux recovery
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 10
    steps:
      - name: Keep real job active for restart and cancellation validation
        run: python3 -u -c "import time; print('Recovery job is running', flush=True); time.sleep(300)"
  macos:
    name: macOS recovery
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 10
    steps:
      - name: Keep real job active for restart and cancellation validation
        run: python3 -u -c "import time; print('Recovery job is running', flush=True); time.sleep(300)"

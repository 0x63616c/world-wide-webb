name: Homelab runner validation
on:
  push:
    branches: [codex/linux-runner-canary]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homelab-runner-validation
  cancel-in-progress: false
jobs:
  baseline:
    name: Linux baseline ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check native Linux and pinned tools
        run: |
          test "$(uname -m)" = aarch64
          test "$(getconf _NPROCESSORS_ONLN)" = 2
          rustup show active-toolchain
          docker info --format '{{.Architecture}}'
      - name: Run representative Rust build and tests
        env:
          CARGO_BUILD_JOBS: '2'
        run: python3 tools/measure_runner_job.py --cohort baseline --slot ${{ matrix.slot }} -- cargo test --locked --workspace --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-baseline-${{ matrix.slot }}
          path: runner-measurement.json
          if-no-files-found: error
  baseline-macos:
    name: macOS baseline ${{ matrix.slot }}
    needs: baseline
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          cache: false
          build-warnings: ''
      - name: Select supported Xcode
        run: echo "DEVELOPER_DIR=$(python3 .github/scripts/apple-toolchain.py)" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - name: Build and test the production Apple app and Swift/Rust contract
        env:
          CARGO_BUILD_JOBS: '4'
          APPLE_DERIVED_DATA: ${{ runner.temp }}/apple-derived
        run: >-
          python3 tools/measure_runner_job.py --cohort baseline-macos --slot ${{ matrix.slot }} --
          bash -c 'bash tools/check apple && bash tools/check integration && bash tools/test_apple.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-baseline-macos-${{ matrix.slot }}
          path: runner-measurement.json
          if-no-files-found: error
  four-linux:
    name: Four Linux ${{ matrix.slot }}
    needs: baseline-macos
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run identical Rust build and tests
        env:
          CARGO_BUILD_JOBS: '2'
        run: python3 tools/measure_runner_job.py --cohort four-linux --slot ${{ matrix.slot }} -- cargo test --locked --workspace --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-four-linux-${{ matrix.slot }}
          path: runner-measurement.json
          if-no-files-found: error
  mixed-linux:
    name: Mixed Linux ${{ matrix.slot }}
    needs: four-linux
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run Rust build and tests alongside macOS guests
        env:
          CARGO_BUILD_JOBS: '2'
        run: python3 tools/measure_runner_job.py --cohort mixed-linux --slot ${{ matrix.slot }} -- cargo test --locked --workspace --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-mixed-linux-${{ matrix.slot }}
          path: runner-measurement.json
          if-no-files-found: error
  mixed-macos:
    name: Mixed macOS ${{ matrix.slot }}
    needs: four-linux
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          cache: false
          build-warnings: ''
      - name: Select supported Xcode
        run: echo "DEVELOPER_DIR=$(python3 .github/scripts/apple-toolchain.py)" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - name: Build and test the production Apple app and Swift/Rust contract
        env:
          CARGO_BUILD_JOBS: '4'
          APPLE_DERIVED_DATA: ${{ runner.temp }}/apple-derived
        run: >-
          python3 tools/measure_runner_job.py --cohort mixed-macos --slot ${{ matrix.slot }} --
          bash -c 'bash tools/check apple && bash tools/check integration && bash tools/test_apple.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-mixed-macos-${{ matrix.slot }}
          path: runner-measurement.json
          if-no-files-found: error

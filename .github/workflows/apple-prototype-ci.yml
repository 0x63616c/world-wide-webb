name: Apple Prototype CI

# Always report build-and-test, including PRs with no native changes.
on:
  pull_request:
  push:
    branches: [WWW-8-apple-prototype, main]

permissions:
  contents: read

concurrency:
  group: apple-prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.filter.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify suite selection and result gate
        run: |
          python3 -B .github/scripts/apple-prototype-changes-test.py
          python3 -B .github/scripts/apple-prototype-unit-schemes-test.py
      - name: Select affected suites
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo '.github/workflows/apple-prototype-ci.yml' > "$RUNNER_TEMP/changed-paths"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
          fi
          python3 .github/scripts/apple-prototype-changes.py < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"

  suites:
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    name: Apple / ${{ matrix.suite }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26.x
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PYCODE'
          import glob, re
          candidates = []
          for path in glob.glob('/Applications/Xcode*.app'):
              import subprocess
              version = subprocess.check_output([path + '/Contents/Developer/usr/bin/xcodebuild', '-version'], text=True)
              match = re.search(r'Xcode (26(?:\.\d+)*)', version)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), path))
          if not candidates:
              raise SystemExit('No Xcode 26.x installed; update the runner image for the native SDK requirement.')
          print(max(candidates)[1])
          PYCODE
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen and check native SDK requirements
        run: |
          brew install xcodegen
          # shellcheck disable=SC2016
          ruby -ryaml -e '
            spec = YAML.load_file("apps/apple-prototype/project.yml")
            panel = spec.fetch("targets").fetch("Panel") { abort "Project has no Panel target." }
            required = panel["deploymentTarget"] || spec.dig("options", "deploymentTarget", "iOS")
            sdk = `xcrun --sdk iphoneos --show-sdk-version`.strip
            abort "Native Panel requires iOS #{required}, but installed SDK is #{sdk}; update the runner/Xcode image." if Gem::Version.new(required.to_s) > Gem::Version.new(sdk)
          '

      - name: Test PanelKit
        if: matrix.suite == 'macos'
        working-directory: apps/apple-prototype/PanelKit
        run: swift test

      - name: Generate Xcode project
        working-directory: apps/apple-prototype
        run: |
          xcodegen generate
          python3 ../../.github/scripts/apple-prototype-unit-schemes.py WorldWideWebb.xcodeproj

      - name: Select available iPad simulator
        id: simulator
        if: matrix.suite == 'ipad' || matrix.suite == 'panel'
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, os, platform
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as source:
              devices = json.load(source)['devices']
          for runtime in sorted(devices, reverse=True):
              if '.iOS-' not in runtime:
                  continue
              for device in devices[runtime]:
                  if device['name'].startswith('iPad') and device.get('isAvailable'):
                      print('destination=platform=iOS Simulator,arch=' + platform.machine() + ',id=' + device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPad simulator installed.')
          PYCODE

      - name: Build macOS app
        if: matrix.suite == 'macos'
        working-directory: apps/apple-prototype
        run: >-
          xcodebuild build -project WorldWideWebb.xcodeproj
          -scheme WorldWideWebb -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      # Build the app and its unit bundle together, once. Keep the same test
      # selectors as before: UI suites belong to their separate workflows.
      - name: Build for testing
        if: matrix.suite == 'ipad' || matrix.suite == 'panel'
        working-directory: apps/apple-prototype
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          SCHEME: ${{ matrix.suite == 'ipad' && 'WorldWideWebb-iPad' || 'Panel' }}
          TEST_TARGET: ${{ matrix.suite == 'ipad' && 'WorldWideWebbTests' || 'PanelTests' }}
        run: >-
          xcodebuild build-for-testing -project WorldWideWebb.xcodeproj
          -scheme "$SCHEME" -destination "$DESTINATION"
          -derivedDataPath "$RUNNER_TEMP/apple-derived-data"
          -only-testing:"$TEST_TARGET" CODE_SIGNING_ALLOWED=NO

      - name: Test without building
        if: matrix.suite == 'ipad' || matrix.suite == 'panel'
        working-directory: apps/apple-prototype
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          TEST_TARGET: ${{ matrix.suite == 'ipad' && 'WorldWideWebbTests' || 'PanelTests' }}
        # Use the built test plan directly: do not reload the project/package
        # graph. Xcode boots this one destination; no separate migration wait.
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_plans=("$RUNNER_TEMP/apple-derived-data/Build/Products/"*.xctestrun)
          [[ ${#test_plans[@]} == 1 ]]
          xcodebuild test-without-building -xctestrun "${test_plans[0]}" \
            -destination "$DESTINATION" -parallel-testing-enabled NO \
            -only-testing:"$TEST_TARGET"

  # Preserve the original check name and fail closed if planning or any suite
  # fails. An empty matrix is an intentional success, not a missing check.
  build-and-test:
    needs: [changes, suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require all affected suites
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
          SUITES: ${{ needs.changes.outputs.suites }}
        run: bash .github/scripts/apple-prototype-result.sh

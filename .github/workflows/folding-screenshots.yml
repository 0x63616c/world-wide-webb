name: Folding PR screenshots
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folding-pr-screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      previews: ${{ steps.select.outputs.previews }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/select
            scripts/ci
          persist-credentials: true
      - id: select
        uses: ./.github/actions/select
  capture:
    name: Folding PR previews
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.previews), 'folding.native')
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      DUO_HOST_CONTROL: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        working-directory: apps/folding
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/folding-tools
        with:
          target: apple
      - run: ../../scripts/ci/apple-desktop.sh bundle exec fastlane ios screenshots_preview
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: folding-pr-native-capture-failure
          path: |
            apps/folding/build/preview-assets/**/assets/native-control/build.log
            apps/folding/build/preview-assets/**/assets/native-control/controller.log
            apps/folding/build/preview-assets/**/assets/native-control/application.log
            apps/folding/build/preview-assets/**/assets/native-control/host-stage.txt
            apps/folding/build/preview-assets/**/assets/native-control/host-hierarchy.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: folding-pr-screenshots-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/folding/build/preview-assets/**/assets/screenshots
            apps/folding/build/preview-assets/**/assets/*manifest.json
          if-no-files-found: error
          retention-days: 7

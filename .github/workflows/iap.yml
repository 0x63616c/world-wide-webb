name: In-app purchases

# Creates or updates the consumable tips in App Store Connect. Never submits anything.
# Run it from the Actions tab, or push a tag iap/<app>/<anything> (for example iap/tendr/tips-3).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Project folder under projects/ (for example tendr)"
        type: string
        default: tendr
  push:
    tags: ["iap/**"]

permissions:
  contents: read

jobs:
  tips:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_DOCS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT ASC_BETA_FEEDBACK_EMAIL; do
            [[ -n "${!name}" ]] || { echo "::error::Missing repository secret $name; see docs/RELEASE.md"; missing=1; }
          done
          exit "$missing"
      - uses: ./.github/actions/ruby-tools
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Create or update the tips
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
          INPUT_APP: ${{ inputs.app }}
        run: |
          app=$INPUT_APP
          if [[ -z "$app" ]]; then
            candidate=$(cut -d/ -f2 <<< "$GITHUB_REF_NAME")
            [[ -f "projects/$candidate/app.yml" ]] && app=$candidate || app=tendr
          fi
          bundle exec fastlane ios tip_iaps app:"$app"

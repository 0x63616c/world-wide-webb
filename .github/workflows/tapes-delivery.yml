name: Tapes delivery
# TestFlight only: Tapes is a private app with no App Store channel.
"on":
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      ci_run_id:
        type: string
        required: true
      ci_run_attempt:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    concurrency:
      group: app-store-tapes
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_DOCS: "1"
      APP: tapes
      SOURCE_SHA: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Check release secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
          MATCH_PASSWORD: ${{ secrets.TAPES_MATCH_PASSWORD }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT ASC_BETA_FEEDBACK_EMAIL MATCH_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret for $name; see docs/RELEASE.md"
              missing=1
            fi
          done
          exit "$missing"
      - uses: ./.github/actions/ruby-tools
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Authorize private signing storage
        uses: ./.github/actions/match-access
        with:
          age-key: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Generate app project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd projects/tapes && xcodegen generate --quiet)
      - name: Upload and distribute to the TestFlight group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
          MATCH_PASSWORD: ${{ secrets.TAPES_MATCH_PASSWORD }}
          GITHUB_SHA: ${{ inputs.source }}
        run: |
          mkdir -p build
          scripts/ci/with-match-signing.sh tapes bundle exec fastlane ios beta app:tapes skip_tests:true "changelog:Build from main ($SOURCE_SHA)"

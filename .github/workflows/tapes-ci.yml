name: Tapes checks
"on":
  workflow_call: {}
defaults:
  run:
    working-directory: projects/tapes/server
permissions:
  contents: read
env:
  IMAGE_REPOSITORY: ghcr.io/0x63616c/www-tapes
jobs:
  server:
    name: Tapes server
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repository-selection
          path: ${{ runner.temp }}/selection
      - name: Read Tapes server selection
        id: select
        run: |
          python3 - "$RUNNER_TEMP/selection/ci-selection.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          selection = json.load(open(sys.argv[1]))
          print("verify=" + str("tapes.server" in selection["verify"]).lower())
          print("publish=" + str("tapes.server" in selection["delivery_candidates"]).lower())
          PY
      - name: Read product Rust pin
        if: steps.select.outputs.verify == 'true'
        id: rust-pin
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 -c 'import tomllib; print("toolchain=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust
        if: steps.select.outputs.verify == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: ${{ steps.rust-pin.outputs.toolchain }}
          components: rustfmt, clippy
          cache: false
          build-warnings: ""
          rustflags: ""
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.select.outputs.verify == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/tapes/server/target
          key:
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/tapes/server/rust-toolchain.toml', 'projects/tapes/server/Cargo.lock')
            }}-tapes-${{ github.sha }}
          restore-keys:
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/tapes/server/rust-toolchain.toml', 'projects/tapes/server/Cargo.lock')
            }}-tapes-
      - if: steps.select.outputs.verify == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: steps.select.outputs.verify == 'true'
        run: cargo test --locked
      - name: OpenAPI document matches the server
        if: steps.select.outputs.verify == 'true'
        run: cargo run --locked -q -- openapi | diff -u ../openapi.json -
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.select.outputs.verify == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: steps.select.outputs.verify == 'true'
        with:
          context: projects/tapes/server
          load: true
          tags: tapes:check
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=tapes
          cache-to: type=gha,mode=max,scope=tapes
      - name: Image serves health with this build
        if: steps.select.outputs.verify == 'true'
        run: |
          container=$(docker run -d --read-only --cap-drop ALL --tmpfs /app/data:uid=10001 -p 127.0.0.1:4300:4300 tapes:check)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for _ in $(seq 50); do
            if health=$(curl -sf http://127.0.0.1:4300/health); then break; fi
            sleep 0.2
          done
          echo "$health"
          python3 -c 'import json,sys; assert json.loads(sys.argv[1])["build"] == sys.argv[2]' "$health" "$GITHUB_SHA"
          docker exec "$container" tapes healthcheck
      - uses: ./.github/actions/ghcr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.publish == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Publish the checked image without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.publish == 'true'
        run: |
          tag="$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker tag tapes:check "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^$IMAGE_REPOSITORY@sha256:")
          python3 -c 'import json,sys; print(json.dumps({"sha": sys.argv[1], "image": sys.argv[2]}))' "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/tapes-image.json"
          cat "$RUNNER_TEMP/tapes-image.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.publish == 'true'
        with:
          name: tapes-image
          path: ${{ runner.temp }}/tapes-image.json
          retention-days: 7
          if-no-files-found: error

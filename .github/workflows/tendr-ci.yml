name: Tendr CI
"on":
  workflow_call: {}
permissions:
  contents: read
jobs:
  changes:
    name: Standard iOS selection
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          filter: blob:none
      - id: detect
        uses: ./.github/actions/affected
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          intent: verify
  app:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select app toolchain
        run: |
          if dir=$(ruby scripts/app-config.rb "$APP" developer_dir 2>/dev/null); then
            echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
          fi
      - name: Core tests
        run: |
          if [[ "$(ruby scripts/app-config.rb "$APP" swift_package 2>/dev/null)" == "true" ]]; then
            swift test --package-path "projects/$APP"
          else
            echo "$APP has no Swift package tests"
          fi
      - name: Screenshot framing tool
        run: |
          if [[ -d "projects/$APP/Tools/rframe" ]]; then
            swift test --package-path "projects/$APP/Tools/rframe"
            swift build --package-path "projects/$APP/Tools/rframe" -c release --product rframe
          else
            echo "$APP has no screenshot framing tool"
          fi
      - name: Project is generated from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if [[ -f "projects/$APP/project.yml" ]]; then (cd "projects/$APP" && xcodegen generate --quiet); fi
          if ! git diff --quiet -- "projects/$APP"; then
            git diff --stat -- "projects/$APP"
            echo "::warning::projects/$APP's Xcode project differs from project.yml; run 'xcodegen generate' in projects/$APP and commit"
          fi
      - name: Build for the simulator
        timeout-minutes: 20
        run: |
          xcodebuild -project "$(ruby scripts/app-config.rb "$APP" project_path)" -scheme "$(ruby scripts/app-config.rb "$APP" scheme)" \
            -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Build the other platforms
        timeout-minutes: 20
        run: |
          # app.yml `platforms` maps tvos/macos to the schemes that ship alongside the iOS app.
          ruby -ryaml -e 'YAML.safe_load_file(ARGV[0]).fetch("platforms", {}).each { |p, s| puts "#{p} #{s}" }' "projects/$APP/app.yml" |
            while read -r platform scheme; do
              case "$platform" in
                tvos) destination='generic/platform=tvOS Simulator' ;;
                macos) destination='generic/platform=macOS' ;;
                *) echo "::error::Unknown platform $platform in projects/$APP/app.yml"; exit 1 ;;
              esac
              xcodebuild -project "$(ruby scripts/app-config.rb "$APP" project_path)" -scheme "$scheme" \
                -destination "$destination" -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet
            done
  gate:
    name: Standard iOS checks
    if: always() && !cancelled()
    needs:
      - changes
      - app
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', 'App selection failed'
          selected = bool(json.loads(results['changes']['outputs']['apps']))
          expected = 'success' if selected else 'skipped'
          assert results['app']['result'] == expected, f'app: expected {expected}'
          PYTHON

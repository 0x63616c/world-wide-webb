name: Tendr CI

# Builds and tests only what changed: each affected app (apps/<app>/), RDesign when packages/
# changes, and the new-app template when it or its script changes. macOS jobs run on GitHub-hosted
# xcode-27 with Xcode 27.1 (see README).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tendr-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      rdesign: ${{ steps.detect.outputs.rdesign }}
      template: ${{ steps.detect.outputs.template }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/affected
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          intent: verify

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate app configuration
        run: ruby scripts/app-config.rb --list
      - name: Release lane checks (no Apple access)
        run: |
          ruby scripts/check-release.rb
          ruby scripts/test-review-products.rb
          ruby scripts/test-release-pipeline.rb
          ruby scripts/test-pending-release.rb
          ruby scripts/test-storefront-status.rb
          python3 scripts/test-resume-release.py
          python3 scripts/test-wait-release-ci.py
      - name: Install impact resolver dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Path filter regression checks
        run: |
          python3 scripts/test-changed-apps.py
          python3 scripts/test-release-source.py
      - name: Duo capture and Xcode selection checks
        run: python3 scripts/test-duo-screenshots.py
      - name: Install screenshot export dependencies
        run: python3 -m pip install -r scripts/requirements-screenshots.txt
      - name: Release target, Duo export and submission checks
        run: python3 scripts/test-release.py
      - name: ASC retirement guard checks
        run: python3 scripts/test-asc-retire.py
      - name: Site publication retention checks
        run: python3 scripts/test-publish-site.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Shell scripts
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh apps/*/scripts/*.sh)
          shellcheck "${scripts[@]}"

  rdesign:
    needs: changes
    if: needs.changes.outputs.rdesign == 'true'
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: RDesign tests (macOS)
        run: swift test --package-path apps/tendr/Packages/RDesign
      - name: rframe builds
        run: swift build --package-path apps/tendr/Packages/RDesign -c release --product rframe

  app:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Select app toolchain
        run: |
          if dir=$(ruby scripts/app-config.rb "$APP" developer_dir 2>/dev/null); then
            echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
          fi
      - name: Core tests
        run: |
          if [[ "$(ruby scripts/app-config.rb "$APP" swift_package 2>/dev/null)" == "true" ]]; then
            swift test --package-path "apps/$APP"
          else
            echo "$APP has no Swift package tests"
          fi
      - name: Project is generated from project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if [[ -f "apps/$APP/project.yml" ]]; then (cd "apps/$APP" && xcodegen generate --quiet); fi
          if ! git diff --quiet -- "apps/$APP"; then
            git diff --stat -- "apps/$APP"
            echo "::warning::apps/$APP's Xcode project differs from project.yml; run 'xcodegen generate' in apps/$APP and commit"
          fi
      - name: Build for the simulator
        timeout-minutes: 20
        run: |
          xcodebuild -project "$(ruby scripts/app-config.rb "$APP" project_path)" -scheme "$(ruby scripts/app-config.rb "$APP" scheme)" \
            -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet

  template:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold a throwaway app from templates/new-app
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          scripts/new-app.sh Samplr samplr
      - name: Build it for the simulator
        timeout-minutes: 20
        run: xcodebuild -project apps/samplr/Samplr.xcodeproj -scheme Samplr -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet

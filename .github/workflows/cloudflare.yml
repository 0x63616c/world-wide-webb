name: Apply Cloudflare
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run to apply
        type: string
        required: true
defaults:
  run:
    working-directory: apps/control-center
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-apply
  cancel-in-progress: false
jobs:
  source:
    name: Cloudflare source
    if: >-
      github.ref == 'refs/heads/main' && vars.OPEN_TOFU_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      infra: ${{ steps.selection.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-cli
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: python3 tools/ci_release_source.py "$RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: apps/control-center
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: selection
        run: |
          python3 - <<'PY'
          import json,os
          value=json.load(open('ci-selection.json'))['apply_infra']
          assert isinstance(value,bool)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('infra='+str(value).lower()+'\n')
          PY
  apply:
    name: Cloudflare apply
    needs: source
    if: needs.source.outputs.infra == 'true'
    runs-on: [self-hosted, Linux, ARM64, homelab-operations]
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.HOMELAB_OPS_TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.HOMELAB_OPS_TS_CLIENT_SECRET }}
          tags: tag:homelab-operations
      - name: Apply tested configuration on the state owner
        env:
          MINI_KNOWN_HOSTS: ${{ vars.HOMELAB_OPS_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.HOMELAB_OPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$MINI_KNOWN_HOSTS"
          test -n "$SSH_KEY"
          key="$RUNNER_TEMP/homelab-operations-key"
          hosts="$RUNNER_TEMP/homelab-operations-known-hosts"
          stage=''
          cleanup() {
            if [[ -n "$stage" ]]; then
              # shellcheck disable=SC2029 # The validated staging path expands locally.
              ssh "${options[@]}" "$remote" "rm -rf -- '$stage'" || true
            fi
            rm -f -- "$key" "$hosts"
          }
          trap cleanup EXIT
          printf '%s\n' "$MINI_KNOWN_HOSTS" > "$hosts"
          printf '%s\n' "$SSH_KEY" > "$key"
          remote=admin@homelab-mac-mini.tail8c014d.ts.net
          options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o IdentityAgent=none -o ForwardAgent=no -o ControlMaster=no -o ControlPath=none
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts")
          candidate_stage=$(ssh "${options[@]}" "$remote" 'mktemp -d /Users/admin/homelab-infra/candidate.XXXXXX')
          if [[ ! "$candidate_stage" =~ ^/Users/admin/homelab-infra/candidate\.[[:alnum:]]+$ ]]; then
            echo 'State owner returned an invalid staging path.' >&2
            exit 1
          fi
          stage=$candidate_stage
          scp "${options[@]}" ../../infra/cloudflare/home/*.tf ../../infra/cloudflare/home/.terraform.lock.hcl \
            ../../.opentofu-version tools/infra_apply.py "$remote:$stage/"
          # shellcheck disable=SC2029 # Pass locally validated paths and release identity.
          result=$(ssh "${options[@]}" "$remote" "python3 '$stage/infra_apply.py' '$stage'")
          # Tailscale SSH can lose a remote failure status on macOS.
          expected='Applied tested Cloudflare configuration; encrypted recovery evidence retained'
          if [[ "$result" != "$expected" ]]; then
            echo 'Cloudflare apply was not confirmed; inspect the state-owner error above.' >&2
            exit 1
          fi
          # shellcheck disable=SC2029 # The validated staging path expands locally.
          ssh "${options[@]}" "$remote" "rm -rf -- '$stage'"
          stage=''
          printf '%s\n' "$expected"

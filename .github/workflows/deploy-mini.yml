name: Promote Control Center image
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run containing the tested immutable image
        type: string
        required: true
defaults:
  run:
    working-directory: projects/control-center
permissions:
  contents: read
  actions: read
concurrency:
  group: control-center-image-promotion
  cancel-in-progress: false
jobs:
  source:
    name: Control Center source
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ci_run_id: ${{ steps.source.outputs.run_id }}
      ci_attempt: ${{ steps.source.outputs.attempt }}
      image: ${{ steps.selection.outputs.image }}
      image_ref: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/github-cli
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: python3 tools/ci_release_source.py "$RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: projects/control-center
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: selection
        run: |
          python3 - <<'PY'
          import json,os
          value=json.load(open('ci-selection.json'))['publish_image']
          assert isinstance(value,bool)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('image='+str(value).lower()+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.selection.outputs.image == 'true'
        with:
          name: ci-image
          path: projects/control-center
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: image
        if: steps.selection.outputs.image == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 tools/ci_image.py select "$SOURCE_SHA"
  promote:
    name: Control Center image pin
    needs: source
    if: needs.source.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CONTROL_CENTER_PROMOTION_DEPLOY_KEY }}
          persist-credentials: true
      - uses: ./.github/actions/github-cli
      - uses: ./.github/actions/install-sops
      - name: Propose the tested image in homelab desired state
        working-directory: .
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          IMAGE: ${{ needs.source.outputs.image_ref }}
          REVISION: ${{ needs.source.outputs.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.source.outputs.ci_run_id }}/attempts/${{ needs.source.outputs.ci_attempt }}
        run: python3 scripts/homelab/promote_control_center.py --source "$REVISION" --image "$IMAGE" --ci-run-url "$CI_RUN_URL"

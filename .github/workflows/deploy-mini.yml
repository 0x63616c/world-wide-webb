name: Deploy Mac mini
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run to deploy
        type: string
        required: true
defaults:
  run:
    working-directory: apps/control-center
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-mini
  cancel-in-progress: false
jobs:
  source:
    if: >-
      vars.MINI_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      generation: ${{ steps.source.outputs.generation }}
      image: ${{ steps.selection.outputs.image }}
      image_ref: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: python3 tools/ci_release_source.py "$RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: apps/control-center
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: selection
        run: |
          python3 - <<'PY'
          import json,os
          value=json.load(open('ci-selection.json'))['publish_image']
          assert isinstance(value,bool)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('image='+str(value).lower()+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.selection.outputs.image == 'true'
        with:
          name: ci-image
          path: apps/control-center
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: image
        if: steps.selection.outputs.image == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 tools/ci_image.py select "$SOURCE_SHA"
  release:
    needs: source
    if: needs.source.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-sops
      - name: Load deployment credentials once
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: sops exec-env ../../secrets/vault.yaml 'python3 tools/ci_deploy_env.py'
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          oauth-secret: ${{ env.TS_CLIENT_SECRET }}
          tags: tag:ci
      - name: Deploy tested image and operations together
        env:
          IMAGE: ${{ needs.source.outputs.image_ref }}
          REVISION: ${{ needs.source.outputs.sha }}
          GENERATION: ${{ needs.source.outputs.generation }}
          MINI_KNOWN_HOSTS: ${{ vars.MINI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$MINI_KNOWN_HOSTS"
          printf '%s\n' "$MINI_KNOWN_HOSTS" > "$RUNNER_TEMP/mini-known-hosts"
          remote=calum@homelab.tail8c014d.ts.net
          options=(-i "$RUNNER_TEMP/mini-key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/mini-known-hosts")
          stage=$(ssh "${options[@]}" "$remote" 'mktemp -d /Users/calum/www-control-center/candidate.XXXXXX')
          [[ "$stage" =~ ^/Users/calum/www-control-center/candidate\.[[:alnum:]]+$ ]]
          # shellcheck disable=SC2029 # The validated staging path must expand locally.
          cleanup() { ssh "${options[@]}" "$remote" "rm -rf -- '$stage'"; }
          trap cleanup EXIT
          files=(release.sh recover.sh compose.yaml sqlite_preflight.py sqlite_snapshot.py tailscale_serve.py backup.py nas-upload.py publish-apple-release.py)
          for file in "${files[@]}"; do scp "${options[@]}" "deploy/mini/$file" "$remote:$stage/$file"; done
          # shellcheck disable=SC2029 # Pass locally validated paths and release identity.
          ssh "${options[@]}" "$remote" \
            "WWW_CODE_DIR='$stage' bash '$stage/release.sh' '$IMAGE' '$REVISION' '$GENERATION'"

name: Deploy Mac mini

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-mini
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.MINI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/ghcr-login
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
      - name: Compute build timestamp
        id: commit-time
        run: echo "ms=$(($(git log -1 --format=%ct) * 1000))" >> "$GITHUB_OUTPUT"
      - name: Build tested revision
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/0x63616c/www-control-center-mini:${{ github.event.workflow_run.head_sha }}
          build-args: |
            BUILD_HASH=${{ github.event.workflow_run.head_sha }}
            BUILD_TIME=${{ steps.commit-time.outputs.ms }}
          cache-from: type=gha,scope=www-mini
          cache-to: type=gha,mode=max,scope=www-mini
      - name: Load deployment credentials
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          sops exec-env secrets/vault.yaml 'python3 - <<'"'"'PY'"'"'
          import os
          from pathlib import Path
          for source, target in [("TAILSCALE_OAUTH_CLIENT__CLIENT_ID", "TS_CLIENT_ID"), ("TAILSCALE_OAUTH_CLIENT__CLIENT_SECRET", "TS_CLIENT_SECRET")]:
              value = os.environ[source]
              print("::add-mask::" + value)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(target + "=" + value + "\n")
          key = Path(os.environ["RUNNER_TEMP"]) / "mini-key"
          key.write_text(os.environ["HOMELAB_SSH__PRIVATE_KEY"] + "\n")
          key.chmod(0o600)
          PY'
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          oauth-secret: ${{ env.TS_CLIENT_SECRET }}
          tags: tag:ci
      - name: Deploy and verify
        env:
          IMAGE: ghcr.io/0x63616c/www-control-center-mini@${{ steps.image.outputs.digest }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          GENERATION: ${{ github.event.workflow_run.run_number }}
          MINI_KNOWN_HOSTS: ${{ vars.MINI_KNOWN_HOSTS }}
        run: |
          test -n "$MINI_KNOWN_HOSTS"
          printf '%s\n' "$MINI_KNOWN_HOSTS" > "$RUNNER_TEMP/mini-known-hosts"
          ssh -i "$RUNNER_TEMP/mini-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/mini-known-hosts" \
            calum@homelab.tail8c014d.ts.net \
            "bash /Users/calum/www-control-center/release.sh '$IMAGE' '$REVISION' '$GENERATION'"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/mini-key"

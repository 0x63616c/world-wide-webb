name: Folding App Store checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folding-store-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.select.outputs.verify }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/select
            scripts/ci
          persist-credentials: true
      - id: select
        uses: ./.github/actions/select
  capture:
    name: Folding App Store screenshots
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.verify), 'folding.native')
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        working-directory: projects/folding
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/folding-tools
        with:
          target: apple
      - run: ../../scripts/ci/apple-desktop.sh bundle exec fastlane ios screenshots environment:production
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: folding-store-native-capture-failure-${{ github.run_attempt }}
          path: |
            projects/folding/build/store-assets/**/assets/native-control/build.log
            projects/folding/build/store-assets/**/assets/native-control/controller.log
            projects/folding/build/store-assets/**/assets/native-control/application.log
            projects/folding/build/store-assets/**/assets/native-control/host-stage.txt
            projects/folding/build/store-assets/**/assets/native-control/host-hierarchy.txt
            projects/folding/build/store-assets/**/assets/native-control/capture.log
            projects/folding/build/store-assets/**/assets/native-control/plan.json
            projects/folding/build/store-assets/**/assets/native-control/simctl-capabilities.txt
            projects/folding/build/store-assets/**/assets/raw/native-displays
            projects/folding/build/store-assets/**/assets/results/*.xcresult
            projects/folding/build/store-assets/**/assets/logs
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: folding-store-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            projects/folding/build/store-assets/**/assets/screenshots
            projects/folding/build/store-assets/**/assets/raw
            projects/folding/build/store-assets/**/assets/review
            projects/folding/build/store-assets/**/assets/metadata
            projects/folding/build/store-assets/**/assets/tip-review-screenshots.json
            projects/folding/build/store-assets/**/assets/*manifest.json
          if-no-files-found: error
          retention-days: 30

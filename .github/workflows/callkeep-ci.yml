name: Callkeep CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: callkeep-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    name: Callkeep selection
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.select.outputs.verify }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/actions/select
            scripts/ci
          persist-credentials: true
      - id: select
        uses: ./.github/actions/select
      - uses: actions/upload-artifact@v4
        with:
          name: callkeep-selection
          path: ${{ runner.temp }}/ci-selection.json
          retention-days: 14
          if-no-files-found: error
  tooling:
    name: Callkeep release invariants
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.verify), 'callkeep.native')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          python3 apps/callkeep/Scripts/test-release.py
          python3 apps/callkeep/Scripts/test-release-notes.py
          python3 -m unittest discover -s scripts/distribution -p 'test*.py'
  native:
    name: Callkeep native
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.verify), 'callkeep.native')
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/callkeep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Diagnose the retained public archive without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import importlib.util, pathlib, subprocess, tempfile
          spec = importlib.util.spec_from_file_location("delivery", "Scripts/release.py")
          delivery = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(delivery)
          original = delivery.prepare.run
          def traced(*args, **kwargs):
              print("READ-ONLY TOOL:", args[0], flush=True)
              try:
                  return original(*args, **kwargs)
              except subprocess.CalledProcessError as error:
                  print("READ-ONLY FAILURE:", args[0], error.returncode, flush=True)
                  if args[0] in {"codesign", "xcrun", "curl", "ditto"}:
                      print(error.stderr, flush=True)
                  raise
          delivery.prepare.run = traced
          with tempfile.TemporaryDirectory() as temporary:
              folder = pathlib.Path(temporary)
              archive = folder / "Callkeep.zip"
              store = delivery.Release("callkeep/v1.0.26")
              record = store.latest()
              print("RELEASE STATE:", record["state"], record["revision"], flush=True)
              for item in record["candidates"].values():
                  downloaded = store.download(item["name"], folder)
                  assert delivery.sha(downloaded) == item["sha256"]
              archive = folder / record["candidates"]["archive"]["name"]
              stage = folder / "stage"
              stage.mkdir()
              delivery.safe_extract(archive, stage)
              delivery.prepare.validate_callkeep_app(stage / "Callkeep.app", "47697228c342315f5425de38980baa94c51a377d", "1.0.26")
          PYTHON
  gate:
    name: Callkeep checks
    needs: [selection, tooling, native]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['selection']['result'] == 'success', 'Selection failed'
          selected = json.loads(results['selection']['outputs']['verify'])
          expected = 'success' if 'callkeep.native' in selected else 'skipped'
          for name in ['native', 'tooling']:
              assert results[name]['result'] == expected, 'Callkeep checks did not complete as selected'
          PYTHON

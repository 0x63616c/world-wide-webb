name: Callkeep CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: callkeep-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    name: Callkeep selection
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.select.outputs.verify }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        uses: ./.github/actions/select
  native:
    name: Callkeep native
    needs: selection
    if: contains(fromJSON(needs.selection.outputs.verify), 'callkeep.native')
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/callkeep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: Scripts/test.sh
  gate:
    name: Callkeep checks
    needs: [selection, native]
    if: always()
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['selection']['result'] == 'success', 'Selection failed'
          selected = json.loads(results['selection']['outputs']['verify'])
          expected = 'success' if 'callkeep.native' in selected else 'skipped'
          assert results['native']['result'] == expected, 'Callkeep checks did not complete as selected'
          PYTHON

name: Apple Panel TestFlight
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
defaults:
  run:
    working-directory: apps/control-center
permissions:
  contents: read
  actions: read
concurrency:
  group: panel-testflight-upload
  cancel-in-progress: false
jobs:
  selection:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    outputs:
      apple: ${{ steps.selection.outputs.apple }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: apps/control-center
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: selection
        run: |
          python3 - <<'PY'
          import json,os
          value=json.load(open('ci-selection.json'))['publish_apple']
          assert isinstance(value,bool)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('apple='+str(value).lower()+'\n')
          PY
  upload:
    needs: selection
    if: needs.selection.outputs.apple == 'true'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/github-cli
      - name: Check processed upload receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/ci_apple_receipt.py
      - name: Use Xcode 27.2 for Duo delivery
        if: steps.receipt.outputs.uploaded != 'true'
        run: xcodebuild -version
      - run: brew install sops
      - run: brew install xcodegen
        if: steps.receipt.outputs.uploaded != 'true' 
      - name: Load signing credentials once
        if: steps.receipt.outputs.uploaded != 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: sops exec-env ../../secrets/vault.yaml 'python3 tools/ci_signing_env.py'
      - uses: ./.github/actions/ruby-tools
        if: steps.receipt.outputs.uploaded != 'true'
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: apps/control-center/apple
      - name: Build and upload tested native revision
        if: steps.receipt.outputs.uploaded != 'true'
        working-directory: apps/control-center/apple
        env:
          PANEL_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bundle exec fastlane release_native
      - name: Record processed upload
        if: steps.receipt.outputs.uploaded != 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json,os
          json.dump({'sha':os.environ['SOURCE_SHA'],'build':int(os.environ['PANEL_UPLOADED_BUILD'])},open('testflight-receipt.json','w'))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.receipt.outputs.uploaded != 'true'
        with:
          name: panel-testflight-${{ github.event.workflow_run.head_sha }}
          path: apps/control-center/testflight-receipt.json
          retention-days: 90
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.HOMELAB_OPS_TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.HOMELAB_OPS_TS_CLIENT_SECRET }}
          tags: tag:homelab
      - name: Publish processed build through the private API
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          WWW_RELEASE_ORIGIN: https://homelab.tail8c014d.ts.net
        run: sops exec-env ../../secrets/vault.yaml 'python3 deploy/mini/publish-apple-release.py'

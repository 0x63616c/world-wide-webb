name: Apple Panel TestFlight
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
defaults:
  run:
    working-directory: apps/control-center
permissions:
  contents: read
  actions: read
concurrency:
  group: panel-testflight-upload
  cancel-in-progress: false
jobs:
  selection:
    if: vars.PANEL_DELIVERY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, Linux, ARM64, homelab-linux]
    outputs:
      apple: ${{ steps.selection.outputs.apple }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: apps/control-center
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: selection
        run: |
          python3 - <<'PY'
          import json,os
          value=json.load(open('ci-selection.json'))['publish_apple']
          assert isinstance(value,bool)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('apple='+str(value).lower()+'\n')
          PY
  upload:
    needs: selection
    if: needs.selection.outputs.apple == 'true'
    runs-on: [self-hosted, macOS, ARM64, homelab-tart]
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check processed upload receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/ci_apple_receipt.py
      - name: Select supported Xcode
        if: steps.receipt.outputs.uploaded != 'true'
        run: echo "DEVELOPER_DIR=$(python3 ../../.github/scripts/apple-toolchain.py)" >> "$GITHUB_ENV"
      - run: brew install sops
      - run: brew install xcodegen
        if: steps.receipt.outputs.uploaded != 'true' 
      - name: Load signing and deployment credentials once
        if: steps.receipt.outputs.uploaded != 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: sops exec-env ../../secrets/vault.yaml 'python3 tools/ci_signing_env.py'
      - name: Load only publication credentials for an existing upload
        if: steps.receipt.outputs.uploaded == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: sops exec-env ../../secrets/vault.yaml 'python3 tools/ci_deploy_env.py'
      - uses: ./.github/actions/ruby-tools
        if: steps.receipt.outputs.uploaded != 'true'
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: apps/control-center/apple
      - name: Build and upload tested native revision
        if: steps.receipt.outputs.uploaded != 'true'
        working-directory: apps/control-center/apple
        env:
          PANEL_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bundle exec fastlane release_native
      - name: Record processed upload
        if: steps.receipt.outputs.uploaded != 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json,os
          json.dump({'sha':os.environ['SOURCE_SHA'],'build':int(os.environ['PANEL_UPLOADED_BUILD'])},open('testflight-receipt.json','w'))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.receipt.outputs.uploaded != 'true'
        with:
          name: panel-testflight-${{ github.event.workflow_run.head_sha }}
          path: apps/control-center/testflight-receipt.json
          retention-days: 90
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          oauth-secret: ${{ env.TS_CLIENT_SECRET }}
          tags: tag:ci
      - name: Publish processed build from the mini
        env:
          MINI_KNOWN_HOSTS: ${{ vars.MINI_KNOWN_HOSTS }}
        run: |
          test -n "$MINI_KNOWN_HOSTS"
          printf '%s\n' "$MINI_KNOWN_HOSTS" > "$RUNNER_TEMP/mini-known-hosts"
          ssh -i "$RUNNER_TEMP/mini-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/mini-known-hosts" \
            calum@homelab.tail8c014d.ts.net "python3 /Users/calum/www-control-center/publish-apple-release.py '$PANEL_UPLOADED_BUILD'"

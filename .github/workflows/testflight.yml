name: iOS delivery
"on":
  workflow_call: {}
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      tendr: ${{ steps.source.outputs.tendr }}
      folding: ${{ steps.source.outputs.folding }}
      backend: ${{ steps.source.outputs.backend }}
      source: ${{ steps.source.outputs.source }}
      channel: ${{ steps.source.outputs.channel }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.source.outputs.ci_run_attempt }}
      ci_run_url: ${{ steps.source.outputs.ci_run_url }}
      receipt_run_id: ${{ steps.source.outputs.receipt_run_id }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/github-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - id: source
        name: Resolve verified source and release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios_delivery.py
  tendr:
    name: Tendr
    needs: verify
    if: needs.verify.outputs.tendr == 'true'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/tendr-delivery.yml
    with:
      source: ${{ needs.verify.outputs.source }}
      channel: ${{ needs.verify.outputs.channel }}
      ci_run_id: ${{ needs.verify.outputs.ci_run_id }}
      ci_run_attempt: ${{ needs.verify.outputs.ci_run_attempt }}
      ci_run_url: ${{ needs.verify.outputs.ci_run_url }}
      receipt_run_id: ${{ needs.verify.outputs.receipt_run_id }}
    secrets: inherit
  folding:
    name: Folding
    needs: verify
    if: needs.verify.outputs.folding == 'true'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/folding-release.yml
    with:
      source: ${{ needs.verify.outputs.source }}
      channel: ${{ needs.verify.outputs.channel }}
      ci_run_id: ${{ needs.verify.outputs.ci_run_id }}
      ci_run_attempt: ${{ needs.verify.outputs.ci_run_attempt }}
      ci_run_url: ${{ needs.verify.outputs.ci_run_url }}
      receipt_run_id: ${{ needs.verify.outputs.receipt_run_id }}
      backend: ${{ needs.verify.outputs.backend == 'true' }}
    secrets: inherit

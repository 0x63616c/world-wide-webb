name: TestFlight

# On every push to main, builds and uploads each app whose binary could have changed (its
# apps/<app>/ code, or declared shared packages) and whose app.yml sets testflight: true.
# Docs, listing text and screenshot-frame changes never start an upload (scripts/affected --intent ship).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: 'App folder under apps/ (for example tendr)'
        type: string
        default: tendr
      confirm_branch_release:
        description: 'Publish this selected non-main branch to TestFlight'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.confirm_branch_release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/affected
        with:
          base: ${{ github.event.before }}
          intent: ship
      - id: detect
        env:
          INPUT_APP: ${{ inputs.app }}
          AFFECTED_APPS: ${{ steps.affected.outputs.apps }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$(ruby scripts/app-config.rb "$INPUT_APP" testflight)" == true ]] || { echo "::error::$INPUT_APP does not have testflight: true"; exit 1; }
            echo "apps=[\"$INPUT_APP\"]" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$AFFECTED_APPS" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  beta:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    # latest_testflight_build_number + 1 must have only one publisher per app at a time.
    concurrency:
      group: testflight-${{ matrix.app }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_SKIP_DOCS: '1'
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT ASC_BETA_FEEDBACK_EMAIL BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name; see docs/RELEASE.md"
              missing=1
            fi
          done
          exit "$missing"
      - name: Select release toolchain
        run: |
          # An app.yml developer_dir overrides the runner default for this job only.
          if dir=$(ruby scripts/app-config.rb "$APP" developer_dir 2>/dev/null); then
            echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$dir"
          fi
          xcodebuild -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install release signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          umask 077
          certificate="$RUNNER_TEMP/$APP-signing.p12"
          keychain="$RUNNER_TEMP/$APP-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          # Preserve the hosted runner's login keychain alongside the temporary signing keychain.
          security list-keychains -d user | xargs > "$RUNNER_TEMP/$APP-keychains-before"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/$APP-keychains-before")
      - name: Generate app project
        run: |
          if [[ -f "apps/$APP/project.yml" ]]; then
            brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
            (cd "apps/$APP" && xcodegen generate --quiet)
          fi
      - name: Test, upload, and distribute to the app's TestFlight group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
        run: bundle exec fastlane ios beta app:"$APP" changelog:"Build from $GITHUB_REF_NAME ($GITHUB_SHA)"
      - name: Remove release signing assets
        if: always()
        run: |
          keychain="$RUNNER_TEMP/$APP-signing.keychain-db"
          if [[ -f "$RUNNER_TEMP/$APP-keychains-before" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/$APP-keychains-before")
            rm -f "$RUNNER_TEMP/$APP-keychains-before"
          fi
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          shopt -s nullglob
          for profile in "$RUNNER_TEMP/$APP.mobileprovision" "$RUNNER_TEMP/$APP-"*.mobileprovision; do
            [[ -f "$profile" ]] || continue
            security cms -D -i "$profile" > "$RUNNER_TEMP/$APP-profile.plist"
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/$APP-profile.plist")
            [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision" "$profile"
          done
          rm -f "$RUNNER_TEMP/$APP-signing.p12" "$RUNNER_TEMP/$APP-profile.plist"

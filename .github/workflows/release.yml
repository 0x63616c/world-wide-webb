name: App delivery
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - main
  push:
    tags:
    - tendr/v*
    - folding/v*
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    name: Delivery
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event
      == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/testflight.yml
    secrets: inherit

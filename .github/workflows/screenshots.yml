name: Screenshots

# Captures an app's App Store screenshots with `fastlane ios screenshots` (snapshot on iPhone 18 Pro Max
# and iPhone Duo, light and dark), frames the iPhone captures and stages the Duo captures.
# Manual preview only: produces reviewable assets without uploading to Apple.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Project folder under projects/ (for example tendr)"
        type: string
        default: tendr
      release_version:
        description: "Version shown in screenshots"
        type: string
      release_build:
        description: "Build shown in screenshots"
        type: string

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APP: ${{ inputs.app }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BUILD: ${{ inputs.release_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/ruby-tools
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Capture, frame and stage App Store screenshots
        timeout-minutes: 40
        run: scripts/ci/apple-desktop.sh bundle exec fastlane ios screenshots app:"$APP"
      - name: Summary
        run: |
          {
            echo "### $APP App Store screenshots"
            echo
            for png in "projects/$APP/fastlane/screenshots/en-US"/*.png; do echo "- \`$(basename "$png")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-store-screenshots-${{ inputs.app }}
          path: |
            projects/${{ inputs.app }}/fastlane/screenshots/en-US/*.png
            build/screenshots/${{ inputs.app }}/overview.png
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screenshots-raw-${{ inputs.app }}
          path: |
            build/screenshots/${{ inputs.app }}/raw
          if-no-files-found: ignore

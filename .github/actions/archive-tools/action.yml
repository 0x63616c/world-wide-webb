name: Prepare archive tools
description: Provide ZIP extraction for tool installers on minimal Linux guests
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v unzip >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unzip
        fi
        unzip -v >/dev/null

# Run from repo root: promtool test rules infra/test/pg-backups.promtool.yaml
rule_files:
  - ../observability/rules/pg-backups.yaml
evaluation_interval: 1m
tests:
  - name: last success ages past 26 hours
    interval: 1h
    input_series:
      - series: kube_cronjob_created{namespace="control-center",cronjob="pg-backup"}
        values: "0x30"
      - series: kube_cronjob_status_last_successful_time{namespace="control-center",cronjob="pg-backup"}
        values: 3600x30
      - series: kube_cronjob_created{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
        values: "0x30"
      - series: kube_cronjob_status_last_successful_time{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
        values: 3600x30
    alert_rule_test:
      - eval_time: 26h
        alertname: PostgresBackupOverdue
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupOverdue
        exp_alerts: []
      - eval_time: 28h
        alertname: PostgresBackupOverdue
        exp_alerts:
          - exp_labels:
              namespace: control-center
              cronjob: pg-backup
              severity: critical
            exp_annotations:
              summary: Control Center has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
          - exp_labels:
              namespace: home-assistant
              cronjob: home-assistant-pg-backup
              severity: critical
            exp_annotations:
              summary: Home Assistant has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
  - name: never succeeded uses creation time
    interval: 1h
    input_series:
      - series: kube_cronjob_created{namespace="control-center",cronjob="pg-backup"}
        values: "0x30"
      - series: kube_cronjob_created{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
        values: "0x30"
    alert_rule_test:
      - eval_time: 25h
        alertname: PostgresBackupOverdue
        exp_alerts: []
      - eval_time: 26h
        alertname: PostgresBackupOverdue
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupOverdue
        exp_alerts:
          - exp_labels:
              namespace: control-center
              cronjob: pg-backup
              severity: critical
            exp_annotations:
              summary: Control Center has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
          - exp_labels:
              namespace: home-assistant
              cronjob: home-assistant-pg-backup
              severity: critical
            exp_annotations:
              summary: Home Assistant has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
  - name: new success clears overdue alerts
    interval: 1h
    input_series:
      - series: kube_cronjob_created{namespace="control-center",cronjob="pg-backup"}
        values: "0x30"
      - series: kube_cronjob_status_last_successful_time{namespace="control-center",cronjob="pg-backup"}
        values: 3600x27 100800x2
      - series: kube_cronjob_created{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
        values: "0x30"
      - series: kube_cronjob_status_last_successful_time{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
        values: 3600x27 100800x2
    alert_rule_test:
      - eval_time: 27h
        alertname: PostgresBackupOverdue
        exp_alerts: []
      - eval_time: 27h1m
        alertname: PostgresBackupOverdue
        exp_alerts:
          - exp_labels:
              namespace: control-center
              cronjob: pg-backup
              severity: critical
            exp_annotations:
              summary: Control Center has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
          - exp_labels:
              namespace: home-assistant
              cronjob: home-assistant-pg-backup
              severity: critical
            exp_annotations:
              summary: Home Assistant has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
      - eval_time: 28h
        alertname: PostgresBackupOverdue
        exp_alerts: []
  - name: missing cron or exporter data fails closed
    interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresBackupOverdue
        exp_alerts:
          - exp_labels:
              namespace: control-center
              cronjob: pg-backup
              severity: critical
            exp_annotations:
              summary: Control Center has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
          - exp_labels:
              namespace: home-assistant
              cronjob: home-assistant-pg-backup
              severity: critical
            exp_annotations:
              summary: Home Assistant has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
  - name: one missing cron alerts independently
    interval: 1h
    input_series:
      - series: kube_cronjob_created{namespace="control-center",cronjob="pg-backup"}
        values: "0x30"
      - series: kube_cronjob_status_last_successful_time{namespace="control-center",cronjob="pg-backup"}
        values: 3600x30
    alert_rule_test:
      - eval_time: 2h
        alertname: PostgresBackupOverdue
        exp_alerts:
          - exp_labels:
              namespace: home-assistant
              cronjob: home-assistant-pg-backup
              severity: critical
            exp_annotations:
              summary: Home Assistant has no successful Postgres backup in 26 hours
              runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md

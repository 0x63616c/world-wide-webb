groups:
  - name: pg-backups
    interval: 1m
    rules:
      - alert: PostgresBackupOverdue
        expr: |
          (time() - (
            kube_cronjob_status_last_successful_time{namespace="control-center",cronjob="pg-backup"}
            or on(namespace, cronjob)
            kube_cronjob_created{namespace="control-center",cronjob="pg-backup"}
          ) > 93600)
          or absent(kube_cronjob_created{namespace="control-center",cronjob="pg-backup"})
        labels:
          namespace: control-center
          cronjob: pg-backup
          severity: critical
        annotations:
          summary: Control Center has no successful Postgres backup in 26 hours
          runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md
      - alert: PostgresBackupOverdue
        expr: |
          (time() - (
            kube_cronjob_status_last_successful_time{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
            or on(namespace, cronjob)
            kube_cronjob_created{namespace="home-assistant",cronjob="home-assistant-pg-backup"}
          ) > 93600)
          or absent(kube_cronjob_created{namespace="home-assistant",cronjob="home-assistant-pg-backup"})
        labels:
          namespace: home-assistant
          cronjob: home-assistant-pg-backup
          severity: critical
        annotations:
          summary: Home Assistant has no successful Postgres backup in 26 hours
          runbook_url: https://github.com/0x63616c/world-wide-webb/blob/main/docs/runbooks/pg-backup.md

name: __NAME__
options:
  bundleIdPrefix: com.calumwebb
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: X9E4HG27NK
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RDesign:
    path: ../../packages/RDesign
targets:
  __NAME__:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RDesign
        product: RDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: __NAME__
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
  __NAME__UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: __NAME__
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  __NAME__:
    build:
      targets:
        __NAME__: all
        __NAME__UITests: [test]
    test:
      targets: [__NAME__UITests]

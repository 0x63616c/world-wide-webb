name: Callkeep
options:
  bundleIdPrefix: co.calum.callkeep
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  CallkeepCore:
    type: framework
    platform: macOS
    sources: [Sources/CallkeepCore]
    settings:
      GENERATE_INFOPLIST_FILE: YES
  Callkeep:
    type: application
    platform: macOS
    sources: [Sources/Callkeep, Resources]
    dependencies:
      - target: CallkeepCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: co.calum.callkeep
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/Callkeep.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      MARKETING_VERSION: '0.1.2'
      CURRENT_PROJECT_VERSION: '3'
  CallkeepTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: CallkeepCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Callkeep:
    build:
      targets:
        Callkeep: all
        CallkeepTests: [test]
    test:
      targets: [CallkeepTests]

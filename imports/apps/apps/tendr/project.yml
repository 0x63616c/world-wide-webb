name: Still
options:
  schemePathPrefix: ../
  bundleIdPrefix: com.calumwebb
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: X9E4HG27NK
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '29'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RDesign:
    path: ../../packages/RDesign
targets:
  Still:
    type: application
    platform: iOS
    sources: [Still]
    dependencies:
      - package: RDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.still
        CODE_SIGN_ENTITLEMENTS: Still/Still.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: Tendr reads your body weight so your progress stays up to date.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Tendr does not write data to Apple Health. Body weight access is read-only.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tendr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_FILE: Still/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: '1'
  StillSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources: [StillSnapshots]
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StillUITests
      - path: Tendr.storekit
        buildPhase: resources
    dependencies:
      - target: Still
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Still:
    build:
      targets:
        Still: all
        StillUITests: [test]
        StillSnapshots: [test]
    run:
      storeKitConfiguration: Tendr.storekit
    test:
      targets: [StillUITests, StillSnapshots]

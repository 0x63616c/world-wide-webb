name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Install test tools
        run: brew install age sops shellcheck
      - name: Check formatting and diagnostics
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          shellcheck src/probe.sh src/remote/*.sh src/first-access/*.sh
      - name: Check versioned configuration schema and example
        run: |
          cargo run --locked --bin homelab -- config schema > /tmp/homelab-v2.schema.json
          diff -u schema/homelab-v2.schema.json /tmp/homelab-v2.schema.json
          env -u HOME target/debug/homelab config validate examples/homelab.json
      - name: Test synthetic setup journeys
        run: cargo test --locked
      - name: Build native release
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: /usr/bin/clang
        run: |
          test "$(uname -m)" = arm64
          cargo build --locked --release --bins
          for binary in homelab homelab-host; do
            file "target/release/$binary" | grep -Eq 'Mach-O 64-bit executable arm64'
            otool -L "target/release/$binary" | awk 'NR > 1 && $1 !~ /^\/(usr\/lib\/|System\/Library\/)/ { bad=1 } END { exit bad }'
            otool -l "target/release/$binary" | awk '$1 == "cmd" && $2 == "LC_RPATH" { bad=1 } END { exit bad }'
          done
          mkdir -p dist
          cp target/release/homelab target/release/homelab-host dist/
          ln -s homelab dist/hl
          cp README.md LICENSE CONTRIBUTING.md dist/
          cp -R docs examples schema dist/
          tar -czf homelab-aarch64-apple-darwin.tar.gz -C dist homelab hl homelab-host README.md LICENSE CONTRIBUTING.md docs examples schema
          shasum -a 256 homelab-aarch64-apple-darwin.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: homelab-${{ github.sha }}
          path: |
            homelab-aarch64-apple-darwin.tar.gz
            SHA256SUMS
          retention-days: 3
  smoke:
    needs: test
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: homelab-${{ github.sha }}
      - name: Check release on a fresh runner without Nix
        run: |
          test ! -e /nix/store
          shasum -a 256 -c SHA256SUMS
          mkdir release
          tar -xzf homelab-aarch64-apple-darwin.tar.gz -C release
          test -s release/LICENSE
          test -s release/docs/images/architecture.svg
          test -s release/schema/homelab-v2.schema.json
          release/homelab --version
          release/hl --version
          release/homelab-host --version
          release/homelab --help
          release/homelab config validate release/examples/homelab.json
          release/homelab-host --help
          test ! -e /nix/store

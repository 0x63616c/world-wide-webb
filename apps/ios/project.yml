name: Folding
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
packages:
  FoldingKit:
    path: Packages/FoldingKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Folding
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    FOLDING_APP_GROUP_IDENTIFIER: ''
    INFOPLIST_KEY_FoldingAppGroupIdentifier: '$(FOLDING_APP_GROUP_IDENTIFIER)'
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': YES
targets:
  Folding:
    type: application
    platform: iOS
    sources:
      - path: App
        includes: ['*.swift', '*.xcstrings']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getfolding.Folding
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Config/Simulator.entitlements
    dependencies:
      - target: FoldingWidgets
        embed: true
      - package: FoldingKit
        product: FoldingDomain
      - package: FoldingKit
        product: FoldingData
  FoldingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getfolding.Folding.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folding
    info:
      path: Config/Widgets-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: FoldingKit
        product: FoldingData
  FoldingBuildTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuildTests
        includes: ['*.swift']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getfolding.Folding.BuildTests
    dependencies:
      - target: Folding
      - package: FoldingKit
        product: FoldingData
      - package: FoldingKit
        product: FoldingDomain
schemes:
  Folding:
    build:
      targets:
        Folding: all
        FoldingBuildTests: [test]
    test:
      config: Debug
      targets:
        - FoldingBuildTests
      gatherCoverageData: true

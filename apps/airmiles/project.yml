name: AirMiles
options:
  bundleIdPrefix: com.calumwebb
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: X9E4HG27NK
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RDesign:
    path: ../../packages/RDesign
  AirMilesCore:
    path: .
targets:
  AirMiles:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RDesign
      - package: AirMilesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calumwebb.airmiles
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Air Miles
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: '1,2'
  AirMilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AirMiles
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AirMiles:
    build:
      targets:
        AirMiles: all
        AirMilesUITests: [test]
    test:
      targets: [AirMilesUITests]

name: WorldWideWebb
options:
  bundleIdPrefix: co.worldwidewebb.prototype
  deploymentTarget:
    macOS: '26.0'
    iOS: '26.0'
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: ''
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_MODULE_NAME: WorldWideWebb
targets:
  WorldWideWebb:
    type: application
    platform: macOS
    sources: [Sources, Shared]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        PRODUCT_BUNDLE_IDENTIFIER: co.worldwidewebb.prototype.mac
        INFOPLIST_KEY_CFBundleDisplayName: World Wide Webb
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
  WorldWideWebb-iPad:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: WalkActivityExtension
        embed: true
    info:
      path: GeneratedAppInfo.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [www-prototype]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        PRODUCT_BUNDLE_IDENTIFIER: co.worldwidewebb.prototype.ipad
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: World Wide Webb
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  WalkActivityExtension:
    type: app-extension
    platform: iOS
    sources: [WalkActivity, Shared]
    settings:
      base:
        PRODUCT_MODULE_NAME: WalkActivityExtension
        PRODUCT_BUNDLE_IDENTIFIER: co.worldwidewebb.prototype.ipad.walkactivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: GeneratedWidgetInfo.plist
      properties:
        CFBundleDisplayName: Walk Zero
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WorldWideWebbTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WorldWideWebb-iPad
    settings:
      base:
        PRODUCT_MODULE_NAME: WorldWideWebbTests
  WorldWideWebbUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WorldWideWebb-iPad
    settings:
      base:
        PRODUCT_MODULE_NAME: WorldWideWebbUITests
schemes:
  WorldWideWebb:
    build:
      targets:
        WorldWideWebb: all
  WorldWideWebb-iPad:
    build:
      targets:
        WorldWideWebb-iPad: all
    test:
      targets:
        - WorldWideWebbTests
        - WorldWideWebbUITests
  WorldWideWebb-Snapshots:
    build:
      targets:
        WorldWideWebb-iPad: [test]
        WorldWideWebbTests: [test]
    test:
      targets:
        - WorldWideWebbTests

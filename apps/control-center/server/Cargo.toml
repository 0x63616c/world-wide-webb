[package]
name = "www-server"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "fs",
  "net",
  "io-util",
  "time",
  "sync"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls"
] }
# Upstream's SQLite 0.39 compatibility fix; return to crates.io once it is released.
sqlx = { version = "=0.9.0", git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros"
] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
subtle = "2"
async-stream = "0.3"
futures-core = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", features = ["sink"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package]
name = "folding-watchdog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Isolated from the application Worker and its deployment artifact.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
futures-util = "=0.3.31"
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"

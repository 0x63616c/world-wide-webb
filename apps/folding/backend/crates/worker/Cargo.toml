[package]
name = "folding-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
folding-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "=0.7.1"
percent-encoding = "=2.3.2"
sha2.workspace = true
worker = { version = "=0.8.7", features = ["d1", "queue"] }
askama = { version = "=0.16.1", default-features = false, features = [
  "derive",
  "std"
] }
p256 = { version = "=0.14.0", default-features = false, features = [
  "ecdsa",
  "alloc",
  "pkcs8"
] }
chrono-tz = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
rasn = { version = "=0.30.0", default-features = false, features = ["bytes"] }
rasn-cms = { version = "=0.30.0", default-features = false }
unicode-casefold = "=0.2.0"
unicode-segmentation = "=1.12.0"
unicode-normalization = "=0.1.24"
ciborium = "=0.2.2"
serde_bytes = "=0.11.19"
base64 = "=0.23.1"
rustls-webpki = { version = "=0.103.15", default-features = false, features = [
  "alloc"
] }
rustls-pki-types = { version = "=1.14.1", default-features = false, features = [
  "alloc"
] }
x509-cert = { version = "=0.3.0", default-features = false }
der = { version = "=0.8.3", default-features = false, features = [
  "alloc",
  "derive"
] }
p384 = { version = "=0.14.0", default-features = false, features = [
  "ecdsa",
  "alloc"
] }
aes-gcm = { version = "=0.11.0", default-features = false, features = [
  "aes",
  "alloc",
  "zeroize"
] }
hmac = "=0.13.0"
rsa = { version = "=0.9.10", default-features = false, features = ["sha2"] }
sha2_10 = { package = "sha2", version = "=0.10.9", default-features = false, features = [
  "oid"
] }
image = { version = "=0.25.10", default-features = false, features = [
  "jpeg",
  "png"
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", features = [
  "Crypto",
  "WorkerGlobalScope",
  "AbortSignal",
  "console"
] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
futures-util = "=0.3.31"

[dev-dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = [
  "bundled"
] }

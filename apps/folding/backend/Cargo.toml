[workspace]
members = ["crates/domain", "crates/worker"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"  # Keep target_features metadata required by wasm-bindgen externref handling.

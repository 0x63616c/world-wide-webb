name: Callkeep
options:
  bundleIdPrefix: co.calum.callkeep
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CALLKEEP_PRODUCTION: NO
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  LocalTranscription:
    path: Packages/LocalTranscription
targets:
  CallkeepCore:
    type: framework
    platform: macOS
    sources: [Sources/CallkeepCore]
    settings:
      GENERATE_INFOPLIST_FILE: YES
  Callkeep:
    type: application
    platform: macOS
    sources: [Sources/Callkeep, Resources]
    dependencies:
      - target: CallkeepCore
      - package: LocalTranscription
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: co.calum.callkeep
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/Callkeep.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      MARKETING_VERSION: '1.0.12'
      CURRENT_PROJECT_VERSION: '12'
  CallkeepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Callkeep/TranscriptionModels.swift
      - Sources/Callkeep/TranscriptionController.swift
      - Sources/Callkeep/VoiceRecognition.swift
      - Sources/Callkeep/AppLog.swift
      - Sources/Callkeep/TitleFailure.swift
      - Sources/Callkeep/LaunchAtLogin.swift
      - Sources/Callkeep/AppIdentity.swift
    dependencies:
      - target: CallkeepCore
      - package: LocalTranscription
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Callkeep:
    build:
      targets:
        Callkeep: all
        CallkeepTests: [test]
    test:
      targets: [CallkeepTests]
